<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Results</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        
        :root {
            --primary: #4361ee;
            --secondary: #3f37c9;
            --accent: #4895ef;
            --light: #f8f9fa;
            --dark: #212529;
            --success: #4cc9f0;
            --warning: #f72585;
            --info: #560bad;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 2rem;
            color: var(--dark);
            animation: gradientBG 15s ease infinite;
            background-size: 400% 400%;
        }
        
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 2.5rem;
            animation: fadeIn 0.8s ease-out;
            overflow: hidden;
            position: relative;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(67, 97, 238, 0.1) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
            z-index: -1;
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        h2, h3 {
            color: var(--primary);
            margin-bottom: 1.5rem;
            position: relative;
            display: inline-block;
        }
        
        h2::after, h3::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            width: 50px;
            height: 4px;
            background: var(--accent);
            border-radius: 2px;
        }
        
        h3::after {
            width: 30px;
            bottom: -5px;
        }
        
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }
        
        .result-card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .result-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        
        .result-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: var(--accent);
        }
        
        .result-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--primary);
        }
        
        .result-title {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--secondary);
        }
        
        .result-score {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--dark);
        }
        
        .recommendations-list {
            list-style: none;
        }
        
        .recommendation-item {
            background: white;
            padding: 1.2rem 1.5rem;
            margin-bottom: 1rem;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            transition: transform 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .recommendation-item:hover {
            transform: translateX(10px);
        }
        
        .recommendation-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 4px;
            background: var(--accent);
        }
        
        .recommendation-icon {
            margin-right: 1rem;
            color: var(--accent);
            font-size: 1.2rem;
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .floating {
            animation: floating 3s ease-in-out infinite;
        }
        
        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 1.5rem;
            }
            
            .results-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container pulse">
        <h2><i class="fas fa-chart-line"></i> Your Test Results</h2>
        
        <div class="results-grid">
            <div class="result-card floating" style="animation-delay: 0.1s;">
                <div class="result-icon">
                    <i class="fas fa-brain"></i>
                </div>
                <div class="result-title">Aptitude</div>
                <div class="result-score">{{ score['aptitude'] }}</div>
            </div>
            
            <div class="result-card floating" style="animation-delay: 0.3s;">
                <div class="result-icon">
                    <i class="fas fa-user-tie"></i>
                </div>
                <div class="result-title">Personality</div>
                <div class="result-score">{{ score['personality'] }}</div>
            </div>
            
            <div class="result-card floating" style="animation-delay: 0.5s;">
                <div class="result-icon">
                    <i class="fas fa-heartbeat"></i>
                </div>
                <div class="result-title">Stress</div>
                <div class="result-score">{{ score['stress'] }}</div>
            </div>
            
            <div class="result-card floating" style="animation-delay: 0.7s;">
                <div class="result-icon">
                    <i class="fas fa-hands-helping"></i>
                </div>
                <div class="result-title">Soft Skills</div>
                <div class="result-score">{{ score['softskills'] }}</div>
            </div>
        </div>
        
        <h3><i class="fas fa-lightbulb"></i> Recommendations</h3>
        <ul class="recommendations-list">
            {% for rec in recommendations %}
                <li class="recommendation-item">
                    <span class="recommendation-icon">
                        <i class="fas fa-check-circle"></i>
                    </span>
                    {{ rec }}
                </li>
            {% endfor %}
        </ul>
    </div>

    <script>
        // Add some interactive animations
        document.addEventListener('DOMContentLoaded', function() {
            const cards = document.querySelectorAll('.result-card');
            
            cards.forEach((card, index) => {
                // Delay the animation for each card
                card.style.animationDelay = `${index * 0.2}s`;
                
                // Add hover effect
                card.addEventListener('mouseenter', function() {
                    this.classList.add('animate__animated', 'animate__pulse');
                });
                
                card.addEventListener('mouseleave', function() {
                    this.classList.remove('animate__animated', 'animate__pulse');
                });
            });
        });
    </script>
</body>
</html>
